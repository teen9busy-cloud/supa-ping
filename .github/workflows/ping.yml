name: Supabase Multi-Project Ping Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'STATUS.md'
      - 'README.md'
  schedule:
    # 하루 2회 (00:00, 12:00 UTC -> 한국시간 오전 9시, 오후 9시) 자동 실행
    - cron: '0 0,12 * * *'

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Run Multi-Project Ping
        env:
          SIMONY_URL: ${{ secrets.SIMONY_URL }}
          SIMONY_KEY: ${{ secrets.SIMONY_KEY }}
          STUDENT_URL: ${{ secrets.STUDENT_URL }}
          STUDENT_KEY: ${{ secrets.STUDENT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node ping.js

      - name: Record Status & Keep Actions Active
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Keep-Alive"
          git add STATUS.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: record keep-alive ping status [skip ci]"
            git push
          fi
